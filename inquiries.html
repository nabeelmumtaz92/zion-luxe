<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion Luxe — Inquiries</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20256%20256%22%3E%20%20%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23F3D77A%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23D4AF37%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23A8841F%22/%3E%3C/linearGradient%3E%3C/defs%3E%20%20%3Crect%20x%3D%228%22%20y%3D%228%22%20width%3D%22240%22%20height%3D%22240%22%20rx%3D%2252%22%20fill%3D%22%230B0B0E%22/%3E%20%20%3Crect%20x%3D%2220%22%20y%3D%2220%22%20width%3D%22216%22%20height%3D%22216%22%20rx%3D%2242%22%20fill%3D%22none%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%225%22/%3E%20%20%3Cpath%20d%3D%22M70%2066h116v24L104%20168h84v24H68v-24l82-78H70z%22%20fill%3D%22url%28%23g%29%22/%3E%3C/svg%3E">
<style>
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,sans-serif;background:#0B0B0E;color:#F4F4F6;display:flex;flex-direction:column;height:100vh}
#top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #262630;background:#0F0F14}
#top img{width:28px;height:28px}#top b{color:#D4AF37;letter-spacing:4px;font-size:15px}
main{flex:1;display:flex;min-height:0}
#list{width:380px;overflow:auto;border-right:1px solid #262630;padding:16px}
#detail{flex:1;overflow:auto;padding:24px}
h1{font-size:16px;color:#D4AF37;margin:0 0 12px;letter-spacing:1px}
.card{background:#141419;border:1px solid #262630;border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer}
.card:hover,.card.sel{border-color:#D4AF37}.muted{color:#9BA1A6;font-size:13px}.gold{color:#D4AF37}
select,input,textarea,button{font:inherit;background:#1b1b22;color:#F4F4F6;border:1px solid #333;border-radius:6px;padding:6px 10px}
button{cursor:pointer;border-color:#D4AF37}textarea{width:100%;min-height:420px;box-sizing:border-box}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
</style></head><body>
<div id="top"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20256%20256%22%3E%20%20%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23F3D77A%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23D4AF37%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23A8841F%22/%3E%3C/linearGradient%3E%3C/defs%3E%20%20%3Crect%20x%3D%228%22%20y%3D%228%22%20width%3D%22240%22%20height%3D%22240%22%20rx%3D%2252%22%20fill%3D%22%230B0B0E%22/%3E%20%20%3Crect%20x%3D%2220%22%20y%3D%2220%22%20width%3D%22216%22%20height%3D%22216%22%20rx%3D%2242%22%20fill%3D%22none%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%225%22/%3E%20%20%3Cpath%20d%3D%22M70%2066h116v24L104%20168h84v24H68v-24l82-78H70z%22%20fill%3D%22url%28%23g%29%22/%3E%3C/svg%3E" alt=""><b>ZION LUXE</b><span class="muted">Private lead desk</span></div>
<main><div id="list"><h1>LEADS <span id="n"></span></h1><div class="row"><button id="scan" onclick="scanNow()">Scan now</button><span id="scanmsg" class="muted"></span></div><div id="cards"></div></div>
<div id="detail"><p class="muted">Select an inquiry.</p></div></main>
<script>
// Reddit RSS bodies end with "&#32; submitted by /u/x to r/y [link] [comments]"
const tidy=t=>String(t||'').replace(/&#32;/g,' ').replace(/\s*submitted by\s+\/u\/\S+\s+to\s+r\/\S+\s*(\[link\])?\s*(\[comments\])?\s*$/i,'').trim();
let data={statuses:[],items:[]},sel=null,editing=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){data=await (await fetch('/api/inquiries')).json();data.items.sort((a,b)=>(b.priority||0)-(a.priority||0)||b.id-a.id);document.getElementById('n').textContent='('+data.items.length+')';scanInfo(data.scan);
 document.getElementById('cards').innerHTML=data.items.map(q=>`<div class="card ${sel==q.id?'sel':''}" onclick="pick(${q.id})"><b>${esc(q.destination)}</b> <span class="gold" style="float:right">${q.priority!=null?'★'+q.priority+' · ':''}${esc(String(q.budget).slice(0,24))}</span><div class="muted">${esc(q.name)} · ${esc(q.tripType)} · ${esc(q.travelers)} trav.</div><div class="muted">${esc(q.status)} · draft: ${esc(q.draftStatus)}</div></div>`).join('')||'<p class="muted">No inquiries yet.</p>';
 if(sel&&!editing)show();}
let scanAsked=false;
function scanInfo(st){if(!st)return;const b=document.getElementById('scan'),m=document.getElementById('scanmsg');b.disabled=st.running;b.textContent=st.running?'Scanning…':'Scan now';
 if(st.running){m.textContent='Checking every source, takes a few minutes';return}
 const l=st.last;if(!l){m.textContent='Auto-scan every '+st.everyMin+' min';return}
 const t=new Date(l.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 m.textContent=(l.error?'Scan failed: '+l.error.slice(0,60):(scanAsked&&l.manual?'Found ':'Last scan '+t+': ')+l.added+' new lead'+(l.added==1?'':'s'))+' · auto every '+st.everyMin+' min'}
async function scanNow(){scanAsked=true;const r=await (await fetch('/api/scan',{method:'POST'})).json();scanInfo(r)}
function pick(id){sel=id;editing=false;load()}
async function upd(id,o){await fetch('/api/inquiries/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});editing=false;load()}
const md=(t)=>String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>').split('\n').map(l=>l.startsWith('##')?`<h3>${l.replace(/^##\s*/,'')}</h3>`:l.startsWith('#')?`<h2>${l.replace(/^#\s*/,'')}</h2>`:l?`<p>${l}</p>`:'').join('');
function show(){const q=data.items.find(x=>x.id==sel);if(!q)return;
 const link=q.ref?'https://zion-luxe.pages.dev/?l='+q.ref:'';
 const emailOk=data.followup&&data.followup.email;
 document.getElementById('detail').innerHTML=`<h1>${esc(q.name)}</h1>
 <div class="muted">${esc(q.email)} · ${esc(q.phone)} · via ${esc(q.source||'—')} · ${esc(q.date.slice(0,10))} ${q.bestTime?('· best time: '+esc(q.bestTime)):''} ${q.okToText?'· OK to text':''}</div>
 ${q.postUrl?`<p><a style="color:#D4AF37" href="${esc(q.postUrl)}" target="_blank" rel="noopener">Open original post ↗</a> <span class="muted">${esc(q.why||'')}</span></p>`:''}<p><b>${esc(q.destination)}</b> · ${esc(q.dates)} · ${esc(q.travelers)} travelers · ${esc(q.tripType)} · ${esc(q.budget)}</p><p class="muted">${esc(tidy(q.notes||q.formNotes))}</p>

 <div style="background:#141419;border:1px solid #262630;border-radius:8px;padding:12px;margin:12px 0">
  <b>Step 1: Outreach message</b> <span class="muted">${esc(q.outreachStatus||'not started')}</span>
  ${link?`<p class="muted">Personal form link: <input style="width:360px;font-size:12px" readonly value="${esc(link)}"> <button onclick="navigator.clipboard.writeText('${link}')">Copy link</button></p>`:''}
  <textarea style="min-height:90px" id="out">${esc(q.outreach||'')}</textarea>
  <div class="row">
    <button onclick="navigator.clipboard.writeText(document.getElementById('out').value)">Copy message</button>
    <button onclick="upd(${q.id},{outreach:1})">Regenerate message</button>
  </div>
  ${(q.thread||[]).filter(m=>m.from==='them'||q.thread.indexOf(m)>0).map(m=>`<div class="muted" style="margin:6px 0;white-space:pre-wrap"><b>${m.from==='us'?'You':'Them'}:</b> ${esc(m.text)}</div>`).join('')}
  <b style="display:block;margin-top:10px">Step 2: They replied?</b>
  <textarea style="min-height:70px" id="their" placeholder="Paste their reply here" oninput="editing=true"></textarea>
  <div class="row"><button onclick="upd(${q.id},{theirReply:document.getElementById('their').value})">Write our reply</button>
   <span class="muted">${q.replyStatus?'Reply: '+esc(q.replyStatus):''}</span></div>
  ${q.replyDraft?`<textarea style="min-height:90px" id="rep">${esc(q.replyDraft)}</textarea>
  <div class="row"><button onclick="navigator.clipboard.writeText(document.getElementById('rep').value)">Copy reply</button>
   <button onclick="upd(${q.id},{replySent:1})">I sent it</button></div>`:''}
 </div>

 <div style="background:#141419;border:1px solid #262630;border-radius:8px;padding:12px;margin:12px 0">
  <b>Call Sheet (Sales Call Prep)</b> <span class="muted">${esc(q.callSheetStatus||'not started')}</span>
  <div style="max-height:260px;overflow:auto;background:#0B0B0E;padding:10px;border-radius:6px;margin-top:6px">${md(q.callSheet||'<i>Fill the form or add notes to generate call sheet.</i>')}</div>
  <div class="row"><button onclick="upd(${q.id},{callSheet:1})">Regenerate call sheet</button></div>
 </div>

 <div class="row">Status <select onchange="upd(${q.id},{status:this.value})">${data.statuses.map(s=>`<option ${s==q.status?'selected':''}>${esc(s)}</option>`).join('')}</select>
 Next follow-up <input type="date" value="${esc(q.followUp)}" onchange="upd(${q.id},{followUp:this.value})">
 <button onclick="upd(${q.id},{regenerate:1})">Regenerate draft</button>
 <button onclick="navigator.clipboard.writeText(document.getElementById('d').value)">Copy draft</button>
 <button onclick="upd(${q.id},{draft:document.getElementById('d').value})">Save edits</button>
 ${emailOk?`<button style="background:#D4AF37;color:#0B0B0E;font-weight:600" onclick="upd(${q.id},{sendEmail:1})">Email draft to lead</button>`:''}</div>
 <div class="muted">Draft: ${esc(q.draftStatus)}${q.draftProvider?' · by '+esc(q.draftProvider):''} ${q.emailNote?' · <span style="color:#F28B82">'+esc(q.emailNote)+'</span>':''}</div>
 <textarea id="d" oninput="editing=true">${esc(q.draft||'')}</textarea>
 ${q.emails&&q.emails.length?`<div class="muted" style="margin-top:10px">Sent emails: ${q.emails.map(e=>esc(e.kind+' ('+(e.ok?'sent':'failed')+': '+e.at.slice(0,16)+')')).join(', ')}</div>`:''}
 `}
load();setInterval(load,4000);
</script></body></html>
