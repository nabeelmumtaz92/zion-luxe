<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion Luxe — Plan your trip</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:#0B0B0E;color:#F4F4F6}
main{max-width:560px;margin:0 auto;padding:40px 20px 60px}
.brand{color:#D4AF37;letter-spacing:4px;font-size:13px;text-transform:uppercase}
h1{font-weight:500;font-size:28px;margin:10px 0 8px}p.lead{color:#B9BEC4;margin:0 0 28px}
label{display:block;font-size:14px;color:#B9BEC4;margin:16px 0 6px}
input,textarea{width:100%;font:inherit;background:#141419;color:#F4F4F6;border:1px solid #2C2C36;border-radius:8px;padding:12px}
input:focus,textarea:focus{outline:none;border-color:#D4AF37}textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;color:#B9BEC4;font-size:14px}.check input{width:auto;margin-top:4px}
button{margin-top:26px;width:100%;font:inherit;font-weight:600;background:#D4AF37;color:#0B0B0E;border:0;border-radius:8px;padding:14px;cursor:pointer}
button:disabled{opacity:.6}.hp{position:absolute;left:-9999px}.err{color:#F28B82;margin-top:12px;min-height:1em}
.fine{color:#7D838A;font-size:13px;margin-top:18px}
</style></head><body><main>
<div class="brand">Zion Luxe</div>
<h1>Let's plan your trip</h1>
<p class="lead">Tell us a little about it and Nabeel will send you a complimentary draft itinerary by email, then set up a short call to shape it together. No obligation.</p>
<form id="f" novalidate>
  <input type="hidden" name="ref" id="ref">
  <div class="hp"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
  <label for="name">Your name</label><input id="name" name="name" autocomplete="name" required>
  <div class="two">
    <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
  </div>
  <label for="bestTime">Best time to call</label><input id="bestTime" name="bestTime" placeholder="e.g. weekday evenings, Central time">
  <label class="check"><input type="checkbox" name="okToText" id="okToText"> It's OK to text me at this number about my trip.</label>
  <label for="destination">Where would you like to go?</label><input id="destination" name="destination">
  <div class="two">
    <div><label for="dates">When</label><input id="dates" name="dates" placeholder="Month or dates"></div>
    <div><label for="travelers">Who's traveling</label><input id="travelers" name="travelers" placeholder="e.g. 2 adults"></div>
  </div>
  <label for="vibe">Budget level and vibe</label><input id="vibe" name="vibe" placeholder="e.g. full five-star, relaxed boutique, adventure with comfort">
  <label for="mustHaves">Non-negotiables</label><input id="mustHaves" name="mustHaves" placeholder="The experiences this trip has to include">
  <div class="two">
    <div><label for="days">How many days</label><input id="days" name="days" inputmode="numeric" placeholder="e.g. 9"></div>
    <div><label for="gettingAround">Getting around</label><select id="gettingAround" name="gettingAround" style="width:100%;font:inherit;background:#141419;color:#F4F4F6;border:1px solid #2C2C36;border-radius:8px;padding:12px">
      <option value="">Choose one</option><option>Happy to drive ourselves</option><option>Prefer private drivers and transfers</option><option>Not sure yet</option></select></div>
  </div>
  <label for="notes">Anything else we should know?</label><textarea id="notes" name="notes" placeholder="Occasion, style, must-dos, hotels you've loved..."></textarea>
  <button id="go" type="submit">Send</button>
  <div class="err" id="err"></div>
  <p class="fine">We use your details only to plan this trip with you. We never share them.</p>
</form>
</main>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('ref').value = (q.get('l') || '').slice(0, 20);
if (q.get('d')) document.getElementById('destination').value = q.get('d').slice(0, 200);
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  const data = Object.fromEntries(new FormData(e.target));
  data.okToText = document.getElementById('okToText').checked;
  if (!data.name.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(data.email.trim())) { err.textContent = 'Please add your name and a valid email.'; return; }
  go.disabled = true; go.textContent = 'Sending…'; err.textContent = '';
  try {
    const r = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Something went wrong.');
    location.href = '/thanks.html?n=' + encodeURIComponent(data.name.trim().split(/\s+/)[0]);
  } catch (x) { err.textContent = x.message; go.disabled = false; go.textContent = 'Send'; }
});
</script></body></html>
